# Used by `wrangler dev` for local tests. Production is deployed with
# scripts/deploy.sh through the Cloudflare API (same settings).
name = "basalt-feedback"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://basalt-os.org"
SITE_URL = "https://basalt-os.org"
RATE_PER_HOUR = "5"
DAILY_CAP = "500"
NOTIFY_FROM = "feedback-bot@obpkg.org"
NOTIFY_TO = "feedback@basalt-os.org"

[[r2_buckets]]
binding = "FEEDBACK"
bucket_name = "basalt-feedback"

# E-mail notification of every submission (Cloudflare Email Routing on
# obpkg.org; the destination must be a verified address).
[[send_email]]
name = "NOTIFY"
destination_address = "feedback@basalt-os.org"
